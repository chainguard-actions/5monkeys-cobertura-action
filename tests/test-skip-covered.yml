name: Test skip covered files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy full coverage fixture to workspace
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/coverage-full.xml" "$GITHUB_WORKSPACE/coverage-full.xml"

      - id: action
        uses: .
        continue-on-error: true
        with:
          repo_token: ${{ github.token }}
          path: coverage-full.xml
          skip_covered: true
          minimum_coverage: '90'
          fail_below_threshold: false

      - name: Assert action ran (succeeds or fails gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With 100% coverage and skip_covered=true, all files are skipped from the report
          # The action may still try to post a PR comment (which fails on sentinel repo)
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with skip_covered=true on 100% coverage file"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo without a real PR)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
