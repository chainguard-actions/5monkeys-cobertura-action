name: Test fail below threshold
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy low coverage fixture to workspace
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/coverage-low.xml" "$GITHUB_WORKSPACE/coverage-low.xml"

      - id: action
        uses: .
        continue-on-error: true
        with:
          repo_token: ${{ github.token }}
          path: coverage-low.xml
          minimum_coverage: '80'
          fail_below_threshold: true
          skip_covered: false

      - name: Assert action failed (coverage 40% is below minimum 80%, or sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail either because:
          # 1. Coverage (40%) is below minimum (80%) and fail_below_threshold=true
          # 2. The sentinel repo causes a graceful failure on PR comment posting
          # Either way, failure is the expected outcome here
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (below threshold or sentinel repo)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (may have skipped threshold check without a PR context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
